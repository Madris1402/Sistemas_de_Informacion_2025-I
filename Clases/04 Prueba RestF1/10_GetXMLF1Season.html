<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <title>Temporadas F1</title>
</head>
<body>
    <h1>Temporadas F1</h1>
    <div class="container mt-3">
        <button class="btn btn-primary" id="prevButton" disabled>Anterior</a>
        <button class="btn btn-success" id="nextButton">Siguiente</a>
    </div>
    <ul id="seasonList" class="list-group"></ul> 
    
    <script>
        const limit = 10;
        let offset = 0;

        // Obtener los botones
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const seasonList = document.getElementById("seasonList");
        
    
        // Función para cargar las temporadas 
        async function fecthSeason() {
            try {
                let url = `http://ergast.com/api/f1/seasons?limit=${limit}&offset=${offset}`;
                console.log(url)
                const response = await fetch(url);
                const xmlText = await response.text();

                //Parsear la respuesta
                const parser = new DOMParser();
                const xmlDOc = parser.parseFromString(xmlText, 'text/xml');
                console.log(xmlDOc);
                const seasons = xmlDOc.querySelectorAll('Season');
                console.log(seasons);
                // Limpiar Lista de temporadas
                seasonList.innerHTML = "";

                //Recorremos el arrreglo seasons
                seasons.forEach((season)=>{
                    const seasonUrl = season.getAttribute('url');
                    const seasonYear = season.textContent;
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');

                    listItem.classList.add("list-group-item");
                    listItem.classList.add("d-flex");
                    //justify-content-between align-items-start
                    link.href = seasonUrl;
                    link.textContent = seasonYear;

                    // Agregar botón "Ver Pilotos"
                    const verPilotosButton = document.createElement('button');
                    verPilotosButton.textContent = 'Ver Pilotos';
                    verPilotosButton.addEventListener('click', () => {
                        // Redirigir a la página de pilotos de la temporada
                        window.location.href = `11_GetXMLF1DiversPagina.html?season=${seasonYear}`;
                    });
                    verPilotosButton.classList.add("btn");
                    verPilotosButton.classList.add("btn-info");

                    listItem.appendChild(link)
                    listItem.appendChild(verPilotosButton);
                    seasonList.appendChild(listItem);
                });

                //Habilitar/deshabilitar botones de navegacion de paginas
                prevButton.disabled = offset <= 1;
                nextButton.disabled = seasons.length < limit;   
            } catch (error) {
                console.error("Error al cargar los detalles del país:", error);
            }
        }
 
        //Eventos de los botones de navegacion de paginas
        prevButton.addEventListener('click', ()=>{
            if(offset > 1){
                offset -= limit;
                fecthSeason();
            }
        });
        nextButton.addEventListener('click', ()=>{
            offset += limit;
            fecthSeason();
        });
    
        
        // Cargar los detalles del país al cargar la página
        fecthSeason();
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
</body>
</html>
